name: Validate Nexus Desk (manual Railway deploy)

on:
  push:
    branches: [main]
    paths:
      - "desk/**"
      - ".github/workflows/deploy-desk-railway.yml"
  workflow_dispatch:

jobs:
  validate-and-optional-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Desk test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Test Desk safety and persistence
        run: python -m unittest discover -s tests -v

      - name: Install Railway CLI
        if: github.event_name == 'workflow_dispatch'
        run: npm install -g @railway/cli

      - name: Manual deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Set GitHub secret RAILWAY_TOKEN to enable deploy."
            exit 1
          fi
          railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --ci
