  <g transform="translate(1180 160) skewX(-18)" opacity="0.55">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="8" y="44" width="220" height="36" rx="6" fill="#a855f7" fill-opacity="0.5"/>
    <rect x="16" y="88" width="220" height="36" rx="6" fill="#22d3ee" fill-opacity="0.45"/>
    <rect x="24" y="132" width="220" height="36" rx="6" fill="#eab308" fill-opacity="0.4"/>
    <rect x="32" y="176" width="220" height="36" rx="6" fill="#f97316" fill-opacity="0.4"/>
  </g>
  <path d="M0 740 L480 460 L860 580 L1600 220" fill="none" stroke="url(#stack)" stroke-opacity="0.35" stroke-width="2"/>
